CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=n #tell Zephyr not to build picolib from module, toolchain should provide it
CONFIG_THREAD_LOCAL_STORAGE=y

CONFIG_GEN_IRQ_VECTOR_TABLE=y

# CONFIG_LOG=y
# CONFIG_PRINTK=y
# CONFIG_USE_SEGGER_RTT=y
# CONFIG_RTT_CONSOLE=y
# CONFIG_LOG_BACKEND_RTT=y
#
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0xF000
CONFIG_MCUBOOT_INDICATION_LED=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_UPGRADE_ONLY=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_UART_CONSOLE=n
# CONFIG_BOOT_MAX_LINE_INPUT_LEN=512
# CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=4096
CONFIG_BOOT_MAX_LINE_INPUT_LEN=8192
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=4096
