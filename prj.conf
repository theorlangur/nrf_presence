CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_NRFX_CUSTOM_BAUDRATE=y

CONFIG_DEBUG_THREAD_INFO=y
CONFIG_INIT_STACKS=n

CONFIG_UART_ASYNC_API=y

CONFIG_REBOOT=y
CONFIG_RAM_POWER_DOWN_LIBRARY=y
CONFIG_SETTINGS=y
CONFIG_REGULATOR=y

CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y
CONFIG_DEBUG_COREDUMP_THREADS_METADATA=y

CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=5000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000
CONFIG_WDT_DISABLE_AT_BOOT=y

CONFIG_HWINFO=y
